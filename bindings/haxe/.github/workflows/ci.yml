# wgrender-hx CI.
#
# The audit reads wgrender's C with clang (tools/refusals.py), and clang comes from
# emsdk. Locally that is allowed to be missing -- the tool says it is skipping and
# exits 0, because a desktop-only checkout builds and tests fine with gcc and hxcpp
# and should not need emsdk to run `test/check.py`. A skip that can happen everywhere
# is not a gate, so this is where it is made mandatory: --require-clang turns a
# missing toolchain into a failure, and nothing reaches main without the step running.
#
# wgrender itself comes from the pinned submodule, so the binding is audited against
# the wgrender it vendors rather than whatever wgrender's main happens to be -- and
# its tools/deps.py is what installs the system headers, for the same reason.
name: ci

on:
  push:
    branches: [main]
    paths-ignore: ["docs/**", "**/*.md"]
  pull_request:
    paths-ignore: ["docs/**", "**/*.md"]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}-${{ github.event_name }}
  cancel-in-progress: true

jobs:
  audit:
    name: audit (refusals, generated sources, WebHost lists)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: recursive

      # compile_flags.txt sets -DSOKOL_GLCORE, so parsing wgr_sokol_impl.c reaches
      # GL/gl.h. Reading the C needs the same system headers compiling it does, and
      # the library ships the list, so use that rather than a copy here that drifts.
      - name: System headers the C includes
        run: |
          sudo apt-get update
          python3 project/lib/wgrender-c/tools/deps.py install

      - uses: actions/cache@v6
        with:
          path: emsdk-cache
          key: emsdk-5.0.7-${{ runner.os }}

      - uses: mymindstorm/setup-emsdk@v16
        with:
          version: 5.0.7
          actions-cache-folder: emsdk-cache

      - name: Refusals read from the C with clang
        # --require-clang: the whole point of this job. Skipping here would make the
        # local skip unbounded, and the audit would quietly never run anywhere.
        run: python3 tools/refusals.py --require-clang

      - name: A documented refusal is repeated in the binding's docs
        run: python3 tools/refusals.py --check

      - name: Each C call has one name; recorded omissions are current
        run: python3 tools/coverage.py --check

      - name: Raw.cpp.hx and Raw.js.hx are current
        run: python3 tools/gen_raw.py --check

      - name: WebHost's hand-kept lists match what they describe
        # GUEST_ABI against host/wgr_guest.h, RUNTIME_METHODS against what src/wgr
        # reaches on the Emscripten module. Pure Python; the rest of test/check.py
        # needs Haxe and hxcpp, which this job does not have.
        run: python3 test/check.py --lists
