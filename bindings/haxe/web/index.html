<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>wgrender-hx, through hxcpp</title>
<!-- The page shell for the examples built through hxcpp into one wasm (tools/hxcppweb.py finishes it with tools/webdeploy.py); the JS guests' pages are wgr.macros.WebHost's. Started from wgrender's examples/web/index.html; this repository's own now. -->
<style>
  html, body { margin: 0; height: 100%; overflow: hidden; background: #15171c;
    color: #cdd3de; font: 14px/1.4 system-ui, sans-serif; }
  #bar { position: fixed; inset: 0 0 auto 0; height: 38px; z-index: 10;
    display: flex; align-items: center; gap: 12px; padding: 0 12px;
    background: #1e2128; border-bottom: 1px solid #2c313c;
    white-space: nowrap; overflow: hidden; }
  #bar b { color: #7ea2ff; }
  #status { color: #7b8494; overflow: hidden; text-overflow: ellipsis; }
  /* a phone's bar has no room for the label: the picker says what it is */
  @media (max-width: 520px) { #exlabel { display: none; } }
  #src { color: #7ea2ff; text-decoration: none; }
  #src:hover { text-decoration: underline; }
  select { background: #0f1115; color: #cdd3de; border: 1px solid #3a4150;
    border-radius: 6px; padding: 4px 8px; font: inherit; }
  /* canvas fills the area below the bar; sokol manages the drawing buffer. Touches
     on it are the program's: the browser doesn't scroll or zoom the page for them. */
  #canvas { position: fixed; inset: 38px 0 0 0; width: 100vw;
    height: calc(100vh - 38px); display: block; background: #000; outline: none;
    touch-action: none; }
  /* A console on the page, because a phone has no easy one: what the program logs,
     and anything the browser refuses to do (a shader that won't link says so here). */
  #log { position: fixed; inset: auto 0 0 0; max-height: 45vh; z-index: 11; display: none;
    overflow-y: auto; padding: 6px 10px; margin: 0; background: #0b0d11ee;
    border-top: 1px solid #2c313c; font: 12px/1.45 ui-monospace, monospace;
    white-space: pre-wrap; overscroll-behavior: contain; }
  #log.on { display: block; }
  #log .warn { color: #ffcc66; }
  #log .err  { color: #ff8080; }
  #logbtn { margin-left: auto; background: #0f1115; color: #cdd3de; border: 1px solid #3a4150;
    border-radius: 6px; padding: 4px 8px; font: inherit; cursor: pointer; }
  #logbtn.alert { border-color: #ff8080; color: #ff8080; }
</style>
</head>
<body>
  <div id="bar">
    <b>wgrender-hx</b>
    <label><span id="exlabel">example </span><select id="ex" aria-label="example"></select></label>
    <a id="src" target="_blank" rel="noopener">source</a>
    <span id="status">loading…</span>
    <button id="logbtn" type="button">console</button>
  </div>
  <pre id="log"></pre>
  <canvas id="canvas" tabindex="-1" oncontextmenu="event.preventDefault()"></canvas>
  <script>
    // ---- console on the page -------------------------------------------------
    // Everything the program prints goes here as well as to the browser's console,
    // so a failure is readable on a phone. Opens itself on the first warning or error.
    const logEl = document.getElementById("log");
    const logBtn = document.getElementById("logbtn");
    const MAX_LINES = 400;
    function addLine(text, kind) {
      const line = document.createElement("span");
      line.className = kind || "";
      line.textContent = text + "\n";
      logEl.appendChild(line);
      while (logEl.childNodes.length > MAX_LINES) logEl.removeChild(logEl.firstChild);
      logEl.scrollTop = logEl.scrollHeight;
      if (kind) logBtn.classList.add("alert");
      if (kind === "err" && !logEl.classList.contains("on")) logEl.classList.add("on");
    }
    logBtn.addEventListener("click", () => {
      logEl.classList.toggle("on");
      if (logEl.classList.contains("on")) logBtn.classList.remove("alert");
    });
    // libwgrender writes every level to stderr, which emscripten sends to printErr, so
    // the level has to come from the line itself: "[WARN ] wgr_model.c:12: ..."
    const LEVEL = /^\[(TRACE|DEBUG|INFO|WARN|ERROR|FATAL)\s*\]/;
    function levelKind(text) {
      const m = LEVEL.exec(text);
      if (!m) return null;
      return (m[1] === "ERROR" || m[1] === "FATAL") ? "err" : m[1] === "WARN" ? "warn" : "";
    }
    for (const [name, kind] of [["log", ""], ["info", ""], ["warn", "warn"], ["error", "err"]]) {
      const original = console[name].bind(console);
      console[name] = (...a) => {
        original(...a);
        addLine(a.map(v => (typeof v === "string" ? v : String(v))).join(" "), kind);
      };
    }
    addEventListener("error", e => addLine("error: " + (e.message || e.type), "err"));
    addEventListener("unhandledrejection", e => addLine("unhandled: " + e.reason, "err"));
    // The page can start with it open: ?console=1, or #console
    if (new URLSearchParams(location.search).get("console") === "1" || location.hash === "#console") {
      logEl.classList.add("on");
    }

    const params  = new URLSearchParams(location.search);
    const current = params.get("ex") || /*wgr:first*/"simple-hxcpp";
    const statusEl = document.getElementById("status");
    const sel = document.getElementById("ex");

    // Where each example's source is read, {name} standing for the example.
    const SOURCE = /*wgr:source*/"https://github.com/whirlinggizmo/wgrender-hx/blob/main/examples/{name}/";
    document.getElementById("src").href = SOURCE.replaceAll("{name}", current);

    // Each program's version (a hash of its .js and .wasm), written in when the site is
    // built (tools/webdeploy.py): files are loaded as name.js?v=<hash>, so a host can
    // keep them for good and a returning visit fetches no code. Empty: unversioned.
    const VERSIONS = /*wgr:versions*/{};
    const version = VERSIONS[current] || {};
    const versioned = (file, hash) => (hash ? file + "?v=" + hash : file);
    const wasmUrl = versioned(current + ".wasm", version.wasm);

    // Start downloading (and compiling, as it streams) the wasm now, alongside the JS,
    // rather than once the JS has run: one round trip less on a first visit.
    const wasmResponse = fetch(wasmUrl, { credentials: "same-origin" });

    // Populate the switcher with the examples that were built.
    (Object.keys(VERSIONS).length
      ? Promise.resolve(Object.keys(VERSIONS))
      : fetch("examples.json").then(r => (r.ok ? r.json() : [])))
      .then(list => {
        if (!list.length) list = [current];
        for (const name of list) {
          const o = document.createElement("option");
          o.value = o.textContent = name;
          if (name === current) o.selected = true;
          sel.appendChild(o);
        }
      })
      .catch(() => {});
    sel.addEventListener("change", () => {
      location.search = "?ex=" + encodeURIComponent(sel.value);
    });

    // What this build needs from the browser. Say so plainly: a missing WebGL2 is a
    // blank canvas otherwise, and a threaded build without cross-origin isolation
    // (a host that can't send COOP/COEP, such as GitHub Pages) can't start at all.
    const missing = (() => {
      if (!window.WebAssembly) return "WebAssembly";
      const canvas = document.createElement("canvas");
      if (!canvas.getContext("webgl2")) return "WebGL2";
      return null;
    })();
    if (missing) {
      statusEl.textContent = "this browser has no " + missing +
        ", which this build needs — try an up-to-date Chrome, Firefox or Safari";
      throw new Error("missing " + missing);
    }

    // Emscripten module: bind the canvas and pipe logs to the console.
    var Module = {
      canvas: document.getElementById("canvas"),
      print:    (...a) => console.log(...a),
      /* by level, not by stream: everything libwgrender logs arrives here */
      printErr: (...a) => {
        const text = a.join(" ");
        const kind = levelKind(text);
        if (kind === "err") console.error(text);
        else if (kind === "warn") console.warn(text);
        else console.log(text);
      },
      // the picker names the example; the status is only for loading and failures
      onRuntimeInitialized: () => { statusEl.textContent = ""; },
      locateFile: (path, prefix) => (path.endsWith(".wasm") ? wasmUrl : prefix + path),
      // Instantiate from the download started above (with its module, which worker
      // threads are sent). A server that doesn't say application/wasm can't stream:
      // then compile from the bytes.
      instantiateWasm: (imports, receive) => {
        const fromBytes = (response) => response.arrayBuffer().then(b => WebAssembly.instantiate(b, imports));
        wasmResponse
          .then(response => (WebAssembly.instantiateStreaming
            ? WebAssembly.instantiateStreaming(response.clone(), imports).catch(() => fromBytes(response))
            : fromBytes(response)))
          .then(result => receive(result.instance, result.module))
          .catch(err => {
            statusEl.textContent = "failed to load " + wasmUrl;
            console.error("wgrender-hx page:", err);
          });
        return {}; // exports arrive through receive()
      },
    };

    // Load the selected example's bundle (each is a standalone emscripten build).
    const s = document.createElement("script");
    s.src = versioned(current + ".js", version.js);
    s.onerror = () => {
      statusEl.textContent = "not built: " + current + "  (examples/build.py web " + current + ")";
    };
    document.body.appendChild(s);
  </script>
</body>
</html>
