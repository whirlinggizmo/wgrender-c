<!doctype html>
<html>
<head>
<meta charset="utf-8">
<title>getters (wgrender host, JS guest)</title>
<!-- Fetch the host, the binding and the wasm in parallel rather than one after another. -->
<link rel="modulepreload" href="../../wgrender-host.js">
<link rel="modulepreload" href="../../wgrender.js">
<link rel="preload" href="../../wgrender-host.wasm" as="fetch" type="application/wasm" crossorigin>
<style>
  html, body { margin: 0; height: 100%; background: #f5f5f5; overflow: hidden; }

  #canvas { position: fixed; inset: 0; width: 100vw; height: 100vh; display: block; outline: none; }
</style>
</head>
<body>
<canvas id="canvas" tabindex="-1" oncontextmenu="event.preventDefault()"></canvas>
<script type="module" src="./main.js"></script>
</body>
</html>
