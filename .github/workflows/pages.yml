# Publish the examples to GitHub Pages: https://whirlinggizmo.github.io/wgrender-c/,
# and the Haxe binding's under /haxe/: each a JS guest on a wgrender wasm host, whose
# index compares its size with the C build of the same example above it.
#
# wasm32-release, without threads, because Pages sends no COOP/COEP headers and a
# threaded build needs cross-origin isolation to get SharedArrayBuffer. Nothing requires
# threads (every example passes webcheck on wasm32-release); asset decoding just runs on
# the main thread, which examples/loading.c says out loud rather than claiming otherwise.
#
# WebGL2 only: it runs everywhere, and it is what CI's browser check gates on, so the
# published site is the one that was tested.
name: pages

on:
  push:
    branches: [main]
    paths-ignore: ["docs/**", "**/*.md"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# One deploy at a time; let a running one finish rather than publishing a half-site.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    name: build the site
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: actions/cache@v6
        with:
          path: emsdk-cache
          key: emsdk-5.0.7-${{ runner.os }}
      - uses: mymindstorm/setup-emsdk@v16
        with:
          version: 5.0.7
          actions-cache-folder: emsdk-cache
      - uses: krdlab/setup-haxe@v2
        with:
          haxe-version: 4.3.7
      - name: Build every example and assemble the site
        run: |
          cmake --preset wasm32-release && cmake --build --preset wasm32-release
          python3 tools/build_site.py out/wasm32/release/site
      - name: The Haxe examples, under /haxe/
        run: |
          haxelib install hxcpp 4.3.2 --always  # pinned, as ci.yml (bindings/haxe/BUILDING.md)
          haxelib dev wgrender-hx bindings/haxe
          python3 bindings/haxe/tools/run_examples.py web
          python3 bindings/haxe/tools/run_examples.py site
          cp -r bindings/haxe/examples/out/wasm32/release/site build/wasm32-release/site/haxe
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: build/wasm32-release/site

  deploy:
    name: deploy
    needs: build
    runs-on: ubuntu-24.04
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
