# wgrender CI: the same checks as a local "done" (see AGENTS.md), minus WebGPU (needs a
# GPU).
#
# - desktop: every push and pull request (skipped for docs-only changes), daily,
#   and on demand. Nothing waits on it; it catches clean-checkout problems (files
#   not committed, new system dependencies).
# - web: daily and on demand (Actions -> ci -> Run workflow), since web breakage
#   from a clean environment is rare and `tools/verify_builds.py --web` runs locally when
#   web code changes.
# - haxe: every push and pull request, the binding in bindings/haxe against the
#   wgrender beside it.
name: ci

on:
  push:
    branches: [main]
    paths-ignore: ["docs/**", "**/*.md"]
  pull_request:
    paths-ignore: ["docs/**", "**/*.md"]
  schedule:
    - cron: "17 9 * * *" # daily, 09:17 UTC
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}-${{ github.event_name }}
  cancel-in-progress: true

jobs:
  desktop:
    name: desktop (build, check, test, smoke)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - name: Install build dependencies
        run: |
          sudo apt-get update
          python3 tools/setup_system_packages.py install
      - name: Build library and examples (GL)
        run: python3 tools/verify_builds.py --only linux-x64-release
      - name: Unit tests, guardrails, and every example headless
        run: python3 tools/verify_builds.py --only linux-x64-debug-headless
      - name: Unit tests under ThreadSanitizer
        run: python3 tools/verify_builds.py --only linux-x64-debug-tsan

  # An EM_JS body is carried through the library as text and only compiled when an
  # example *links* -- closure runs then. So the desktop job above and a library
  # build all pass on a web build that cannot link, and the first thing to
  # notice is the pages deploy (it happened: "$0 is undeclared", a commit that was
  # green here and red there). Linking one example on every push closes that.
  web-link:
    name: web (one example links)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - name: The Emscripten version build.json pins
        id: pins
        run: echo "emscripten=$(python3 -c "import json; print(json.load(open('build.json'))['emscripten'])")" >> "$GITHUB_OUTPUT"
      - uses: actions/cache@v6
        with:
          path: emsdk-cache
          key: emsdk-${{ steps.pins.outputs.emscripten }}-${{ runner.os }}
      - uses: mymindstorm/setup-emsdk@v16
        with:
          version: ${{ steps.pins.outputs.emscripten }}
          actions-cache-folder: emsdk-cache
      - name: Link a web example (compiles every EM_JS body)
        run: cmake --preset wasm32-release-threads && cmake --build --preset wasm32-release-threads --target hello

  web:
    name: web (WebGL2 build + browser check)
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - name: The Emscripten version build.json pins
        id: pins
        run: echo "emscripten=$(python3 -c "import json; print(json.load(open('build.json'))['emscripten'])")" >> "$GITHUB_OUTPUT"
      - uses: actions/cache@v6
        with:
          path: emsdk-cache
          key: emsdk-${{ steps.pins.outputs.emscripten }}-${{ runner.os }}
      - uses: mymindstorm/setup-emsdk@v16
        with:
          version: ${{ steps.pins.outputs.emscripten }}
          actions-cache-folder: emsdk-cache
      - name: Build and check in headless Chrome
        # Two vCPUs: two examples at a time (each spins up decode workers of its own),
        # and twice the deadline. Four at a time starved a model's decode past 20 s.
        run: |
          cmake --preset wasm32-release-threads && cmake --build --preset wasm32-release-threads
          python3 tools/check_web_examples.py --backend=webgl2 --threads --jobs=2 --settle=40000
      - name: Upload screenshots
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: webcheck-screenshots
          path: build/wasm32-release-threads/webcheck
          if-no-files-found: ignore

  # The Haxe binding: its audit, then its whole suite (bindings/haxe/tools/check_binding.py:
  # the generators current, headless hxcpp, JS, cppia, its C). The audit reads
  # wgrender's C with clang, which comes from emsdk. Locally a missing clang is a skip,
  # so a desktop-only checkout still tests; a skip that can happen everywhere is not a
  # gate, so here --require-clang makes it one.
  haxe:
    name: haxe (binding audit and tests)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      # parsing wgr_sokol_impl.c reaches GL/gl.h: the audit needs the same system
      # headers compiling does
      - name: Install build dependencies
        run: |
          sudo apt-get update
          python3 tools/setup_system_packages.py install
      - name: The Emscripten version build.json pins
        id: pins
        run: echo "emscripten=$(python3 -c "import json; print(json.load(open('build.json'))['emscripten'])")" >> "$GITHUB_OUTPUT"
      - uses: actions/cache@v6
        with:
          path: emsdk-cache
          key: emsdk-${{ steps.pins.outputs.emscripten }}-${{ runner.os }}
      - uses: mymindstorm/setup-emsdk@v16
        with:
          version: ${{ steps.pins.outputs.emscripten }}
          actions-cache-folder: emsdk-cache
      - uses: krdlab/setup-haxe@v2
        with:
          haxe-version: 4.3.7
      - name: The binding from this checkout, and hxcpp
        run: |
          haxelib install hxcpp 4.3.2 --always  # pinned: what haxelib serves users (bindings/haxe/BUILDING.md)
          haxelib dev wgrender-hx bindings/haxe
      - name: Refusals read from the C with clang
        run: python3 bindings/haxe/tools/check_refusals.py --require-clang
      - name: The binding's suite
        run: python3 bindings/haxe/tools/check_binding.py
